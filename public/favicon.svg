<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Welcome Orange Background Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7d3b" />
      <stop offset="50%" stop-color="#ff6321" />
      <stop offset="100%" stop-color="#d9480f" />
    </linearGradient>
    
    <!-- Spine / Page Shadow Gradient -->
    <linearGradient id="pageShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Book Page Highlight Gradient -->
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff7ed" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c1d06" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Orange Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#orangeGrad)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" />

  <!-- Central Book Graphic -->
  <g filter="url(#softGlow)" transform="translate(0, 0)">
    <!-- Book Back Cover / Shadow outline -->
    <path d="M 112,176 C 180,160 240,180 256,192 C 272,180 332,160 400,176 L 400,344 C 332,328 272,348 256,360 C 240,348 180,328 112,344 Z" 
          fill="#7c2d12" opacity="0.6" />

    <!-- Left Page Group -->
    <path d="M 120,168 C 184,152 244,172 256,184 L 256,348 C 244,336 184,316 120,332 Z" 
          fill="url(#bookCoverGrad)" />
    
    <!-- Right Page Group -->
    <path d="M 392,168 C 328,152 268,172 256,184 L 256,348 C 268,336 328,316 392,332 Z" 
          fill="url(#bookCoverGrad)" />

    <!-- Spine Divider Line -->
    <path d="M 256,184 L 256,348" stroke="#ff6321" stroke-width="4" stroke-linecap="round" />

    <!-- Left Page Faux Lines -->
    <line x1="152" y1="216" x2="228" y2="204" stroke="#ff6321" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="148" y1="244" x2="232" y2="232" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <line x1="148" y1="272" x2="228" y2="260" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <line x1="152" y1="300" x2="208" y2="290" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

    <!-- Right Page Faux Lines -->
    <line x1="284" y1="204" x2="360" y2="216" stroke="#ff6321" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="280" y1="232" x2="364" y2="244" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <line x1="280" y1="260" x2="360" y2="272" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <line x1="280" y1="290" x2="336" y2="300" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

    <!-- Center Ribbon Bookmark -->
    <path d="M 256,184 Q 256,260 272,320 L 260,312 L 248,320 Z" fill="#ff6321" />
  </g>
</svg>
